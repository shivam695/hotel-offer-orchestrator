services:
  redis:
    image: redis:7-alpine

  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "8233:8233"   # Temporal dashboard

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      SUPPLIER_BASE_URL: http://api:3000
    depends_on:
      - redis
      - temporal
    restart: on-failure

  worker:
    build: .
    command: ["npx", "tsx", "src/worker.ts"]
    environment:
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      SUPPLIER_BASE_URL: http://api:3000
    depends_on:
      - redis
      - temporal
    restart: on-failure